[package]
name = "open-assistant"
version = "0.1.0"
description = "Open Assistant for Windows"
authors = ["Open Assistant"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4"] }
# Cliente HTTP: Ollama/BitNet locais e downloads das ferramentas (GitHub/Hugging Face, via TLS).
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# Voz local (Microsoft ONNX Runtime + sherpa-onnx). A DLL é baixada em Configurações e
# carregada sob demanda (/DELAYLOAD no build.rs), então o app abre mesmo sem ela.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
# Agente que controla o PC: prints (xcap + image), mouse/teclado (enigo), elementos de
# interface (UI Automation), catálogo de intents em YAML e APIs Win32 pontuais.
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
enigo = "0.6"
uiautomation = "0.25"
serde_yaml = "0.9"
regex = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

